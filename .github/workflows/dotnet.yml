name: dotnet

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Sigtran.NET.sln

      - name: Build
        run: dotnet build src/Sigtran.NET.sln --configuration Release --no-restore

      - name: Test
        run: dotnet run --project src/Sigtran.NET.Tests/Sigtran.NET.Tests.csproj --configuration Release --no-build

      - name: Test qualification contracts and tamper rejection
        run: dotnet run --project eng/Sigtran.NET.Qualification.Tests --configuration Release --no-build

      - name: Test qualification plan launcher
        run: python3 scripts/tests/test_qualification_plan.py

      - name: Test capture backend and inventory
        run: python3 scripts/tests/test_capture_backend.py

      - name: Test MAP SMS wire evidence verification
        shell: bash
        run: |
          bash -n scripts/run-end-to-end-ss7-lab.sh
          python3 scripts/tests/test_wire_profile.py

      - name: Test SCTP multihoming evidence verification
        run: python3 scripts/tests/test_sctp_multihoming_evidence.py

      - name: Test legacy flag promotion rejection
        shell: pwsh
        run: ./eng/test-qualification-gate.ps1

      - name: Test operator profile framework
        run: dotnet run --project src/Sigtran.NET.ProfileTests/Sigtran.NET.ProfileTests.csproj --configuration Release

      - name: Test M3UA HA routing
        run: dotnet run --project src/Sigtran.NET.HaTests/Sigtran.NET.HaTests.csproj --configuration Release

      - name: Test M3UA HA dispatch semantics
        run: dotnet run --project src/Sigtran.NET.HaDispatchTests/Sigtran.NET.HaDispatchTests.csproj --configuration Release

      - name: Test M3UA HA dispatch coordinator
        run: dotnet run --project src/Sigtran.NET.HaCoordinatorTests/Sigtran.NET.HaCoordinatorTests.csproj --configuration Release

      - name: Test M3UA HA runtime fan-in
        run: dotnet run --project src/Sigtran.NET.HaRuntimeTests/Sigtran.NET.HaRuntimeTests.csproj --configuration Release

      - name: Test M3UA HA runtime generation lifecycle
        run: dotnet run --project src/Sigtran.NET.HaLifecycleTests/Sigtran.NET.HaLifecycleTests.csproj --configuration Release

      - name: Validate multi-host qualification orchestration
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/run-multi-host-qualification.sh
          bash -n scripts/run-native-sctp-multihoming-lab.sh
          bash -n scripts/run-mtp3-m2pa-lab.sh
          if output=$(bash scripts/run-native-sctp-multihoming-lab.sh --isolated "$RUNNER_TEMP" unused "$(readlink /proc/self/ns/net)" 2>&1); then
            exit 1
          fi
          [[ "$output" == "Refusing to run in the host network namespace" ]]
          bash -n scripts/provision-reference-peer.sh
          bash -n scripts/peer-outage-recovery.sh
          bash -n scripts/run-with-peer-ssh.sh
          for profile in smoke stress soak release; do
            for fault in peer-restart peer-outage sctp-partition; do
              QUALIFICATION_PROFILE="$profile" \
              FAULT_SCENARIO="$fault" \
              PLAN_ONLY=true \
                bash scripts/run-multi-host-qualification.sh >/dev/null
            done
          done
          python3 -u scripts/tests/test_qualification_safety.py
          python3 -u scripts/tests/test_kubernetes_sctp_evidence.py
          python3 -u scripts/tests/test_kubernetes_cni_policy_stage1.py

      - name: Verify development and release package identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(dotnet msbuild src/Sigtran.NET/Sigtran.NET.csproj -nologo -getProperty:PackageVersion | tail -n 1 | tr -d '\r')"
          version="$(dotnet msbuild src/Sigtran.NET/Sigtran.NET.csproj -nologo -getProperty:Version | tail -n 1 | tr -d '\r')"
          override_version="1.0.0-release-override-test"
          override_package_version="$(dotnet msbuild src/Sigtran.NET/Sigtran.NET.csproj -nologo /p:Version="$override_version" -getProperty:PackageVersion | tail -n 1 | tr -d '\r')"
          test "$package_version" = "1.0.0-rc.3-dev"
          test "$version" = "1.0.0-rc.3-dev"
          test "$override_package_version" = "$override_version"

      - name: Generate current public API snapshot
        shell: pwsh
        run: |
          ./eng/generate-public-api-baseline.ps1 `
            -OutputPath "artifacts/ci-api/Sigtran.NET.current.public-api.txt"

      - name: Verify admitted 1.0 public API contract
        shell: pwsh
        run: |
          ./eng/compare-public-api.ps1 `
            -CurrentPath "artifacts/ci-api/Sigtran.NET.current.public-api.txt" `
            -OutputPath "artifacts/ci-api/Sigtran.NET.api-diff.md" `
            -FailOnAnyChange

      - name: Verify stable evaluator remains fail-closed
        shell: pwsh
        run: |
          ./eng/evaluate-stable-release.ps1 `
            -ExpectedVersion "1.0.0" `
            -JsonOutputPath "artifacts/ci-api/stable-release-decision.json" `
            -MarkdownOutputPath "artifacts/ci-api/stable-release-decision.md"
          $decision = Get-Content "artifacts/ci-api/stable-release-decision.json" -Raw | ConvertFrom-Json
          if ($decision.decision -ne "NO-GO") {
            throw "Stable evaluator must remain NO-GO while qualification gates are open."
          }
          if (@($decision.blockers).Count -ne 5 -or $decision.candidateQualification.decision -ne 'NO-GO') {
            throw "Expected four historical blockers plus the mandatory candidate qualification blocker."
          }
          if (-not $decision.publicApiBaseline.acceptedAdditionsPresent) {
            throw "Stable evaluator did not retain the accepted public API additions evidence."
          }

      - name: Upload current public API evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-public-api
          path: |
            artifacts/ci-api/Sigtran.NET.current.public-api.txt
            artifacts/ci-api/Sigtran.NET.api-diff.md
            artifacts/ci-api/stable-release-decision.json
            artifacts/ci-api/stable-release-decision.md
          if-no-files-found: error

      - name: Pack
        run: dotnet pack src/Sigtran.NET/Sigtran.NET.csproj --configuration Release --no-build

      - name: Verify development package artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f src/Sigtran.NET/bin/Release/Sigtran.NET.1.0.0-rc.3-dev.nupkg
          test -f src/Sigtran.NET/bin/Release/Sigtran.NET.1.0.0-rc.3-dev.snupkg
          test ! -f src/Sigtran.NET/bin/Release/Sigtran.NET.1.0.0-rc.2.nupkg
