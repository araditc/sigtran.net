name: phase56-operator-profile-interop

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: Non-secret operator/vendor profile identifier
        required: true
        type: string
      confirmation:
        description: Type "run operator profile <profile_id>"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: phase56-operator-profile
  cancel-in-progress: false

jobs:
  interop:
    runs-on: [self-hosted, linux, sigtran-operator-lab]
    environment:
      name: operator-interop
    timeout-minutes: 30
    env:
      RUN_ID: phase56-operator-${{ github.run_id }}
      PROFILE_ID: ${{ inputs.profile_id }}
      OPERATOR_REMOTE_IP: ${{ secrets.OPERATOR_REMOTE_IP }}
      OPERATOR_REMOTE_PORT: ${{ secrets.OPERATOR_REMOTE_PORT }}
      OPERATOR_LOCAL_POINT_CODE: ${{ secrets.OPERATOR_LOCAL_POINT_CODE }}
      OPERATOR_REMOTE_POINT_CODE: ${{ secrets.OPERATOR_REMOTE_POINT_CODE }}
      OPERATOR_NETWORK_INDICATOR: ${{ secrets.OPERATOR_NETWORK_INDICATOR }}
      OPERATOR_PEER_NAME: ${{ secrets.OPERATOR_PEER_NAME }}
      OPERATOR_SUBSCRIBER_MSISDN: ${{ secrets.OPERATOR_SUBSCRIBER_MSISDN }}
      OPERATOR_SUBSCRIBER_IMSI: ${{ secrets.OPERATOR_SUBSCRIBER_IMSI }}
      OPERATOR_SERVICE_CENTRE: ${{ secrets.OPERATOR_SERVICE_CENTRE }}
      CAPTURE_INTERFACE: ${{ vars.OPERATOR_CAPTURE_INTERFACE || 'any' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate explicit authorization and environment
        shell: bash
        run: |
          set -euo pipefail
          expected="run operator profile $PROFILE_ID"
          test "${{ inputs.confirmation }}" = "$expected"
          for name in             OPERATOR_REMOTE_IP OPERATOR_REMOTE_PORT             OPERATOR_LOCAL_POINT_CODE OPERATOR_REMOTE_POINT_CODE             OPERATOR_NETWORK_INDICATOR OPERATOR_PEER_NAME             OPERATOR_SUBSCRIBER_MSISDN OPERATOR_SUBSCRIBER_IMSI             OPERATOR_SERVICE_CENTRE; do
            test -n "${!name}" || { echo "Missing required protected value: $name" >&2; exit 1; }
          done
          for cmd in dotnet tcpdump tshark sha256sum python3; do
            command -v "$cmd" >/dev/null
          done
          sudo -n true >/dev/null

      - name: Build operator-profile lab client
        run: dotnet build src/Sigtran.NET.EndToEndLab/Sigtran.NET.EndToEndLab.csproj -c Release -m:1

      - name: Run protected operator/vendor profile flow
        shell: bash
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE/artifacts/operator/$RUN_ID"
          mkdir -p "$root/raw" "$root/safe"
          trace="$root/raw/sdk-trace.jsonl"
          summary="$root/raw/summary.json"
          pcap="$root/raw/traffic.pcap"
          capture_log="$root/raw/tcpdump.log"

          sudo -n tcpdump             -i "$CAPTURE_INTERFACE"             --immediate-mode -U             -w "$pcap"             "sctp and host $OPERATOR_REMOTE_IP and port $OPERATOR_REMOTE_PORT"             >"$capture_log" 2>&1 &
          tcpdump_pid=$!
          trap 'sudo -n kill -INT "$tcpdump_pid" 2>/dev/null || true' EXIT
          sleep 1

          set +e
          timeout 120s dotnet run             --project src/Sigtran.NET.EndToEndLab/Sigtran.NET.EndToEndLab.csproj             -c Release --no-build --             --remote-ip "$OPERATOR_REMOTE_IP"             --remote-port "$OPERATOR_REMOTE_PORT"             --local-point-code "$OPERATOR_LOCAL_POINT_CODE"             --remote-point-code "$OPERATOR_REMOTE_POINT_CODE"             --network-indicator "$OPERATOR_NETWORK_INDICATOR"             --peer-name "$OPERATOR_PEER_NAME"             --subscriber-msisdn "$OPERATOR_SUBSCRIBER_MSISDN"             --subscriber-imsi "$OPERATOR_SUBSCRIBER_IMSI"             --service-centre "$OPERATOR_SERVICE_CENTRE"             --trace "$trace"             --summary "$summary"             --run-id "$RUN_ID"             --timeout-seconds 90
          sdk_rc=$?
          set -e

          sudo -n kill -INT "$tcpdump_pid" 2>/dev/null || true
          wait "$tcpdump_pid" 2>/dev/null || true
          trap - EXIT
          sudo -n chown "$(id -u):$(id -g)" "$pcap" "$capture_log" 2>/dev/null || true

          test "$sdk_rc" -eq 0
          python3 - "$summary" "$trace" "$root/safe/summary.json" "$root/safe/report.md" <<'PY'
          import hashlib, json, sys
          from pathlib import Path

          summary_path, trace_path, safe_summary_path, report_path = map(Path, sys.argv[1:])
          summary=json.loads(summary_path.read_text())
          if summary.get("Passed") is not True:
              raise SystemExit("operator profile summary did not pass")

          events=[json.loads(line) for line in trace_path.read_text().splitlines() if line.strip()]
          map_events=[e for e in events if e.get("Layer")=="map"]
          expected={
              "sendRoutingInfoForSM",
              "mo-ForwardSM",
              "mt-ForwardSM",
              "reportSM-DeliveryStatus",
              "alertServiceCentre",
          }
          observed={e.get("Event") for e in map_events}
          if not expected.issubset(observed):
              raise SystemExit(f"missing MAP operations: {sorted(expected-observed)}")

          safe={
              "schemaVersion":1,
              "runId":summary.get("RunId"),
              "passed":True,
              "peerName":summary.get("PeerName"),
              "remoteEndpoint":"[redacted]",
              "operations":summary.get("Operations"),
              "mapOperationCount":len(map_events),
          }
          safe_summary_path.write_text(json.dumps(safe, indent=2)+"\n")
          report_path.write_text(
              "# Phase 56 Operator/Vendor Profile Interoperability\n\n"
              f"- Run: {safe['runId']}\n"
              f"- Profile: {Path('.').resolve().name}\n"
              f"- Peer: {safe['peerName']}\n"
              "- End-to-end MAP SMS operation set: PASS\n"
              "- Sensitive subscriber identifiers and remote endpoint: REDACTED\n"
              "- Raw PCAP and raw summary: retained only in protected workflow artifact\n"
          )
          PY

          tshark -r "$pcap"             -T fields             -E header=y -E separator=$'\t'             -e frame.number -e sctp.srcport -e sctp.dstport             -e m3ua.message_class -e m3ua.message_type             > "$root/safe/protocol-fields.tsv" 2>/dev/null || true

          sha256sum "$pcap" "$summary" "$trace" > "$root/safe/raw-evidence.sha256"
          printf 'profileId=%s\nrunId=%s\n' "$PROFILE_ID" "$RUN_ID" > "$root/safe/profile.txt"
          find "$root/safe" -type f ! -name sha256.txt -print0 | sort -z | xargs -0 sha256sum > "$root/safe/sha256.txt"

      - name: Upload protected raw evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase56-operator-profile-raw
          path: artifacts/operator/${{ env.RUN_ID }}/raw
          retention-days: 30

      - name: Retain sanitized evidence branch
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          source_dir="artifacts/operator/$RUN_ID/safe"
          evidence_dir="docs/evidence/PHASE56_OPERATOR_$GITHUB_RUN_ID"
          branch="evidence/operator-$GITHUB_RUN_ID"
          git fetch origin main
          git checkout -B "$branch" origin/main
          mkdir -p "$evidence_dir"
          cp -a "$source_dir/." "$evidence_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$evidence_dir"
          git commit -m "evidence: retain operator profile run $GITHUB_RUN_ID"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Open evidence review pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.evidence.outputs.branch }}
          EVIDENCE_DIR: ${{ steps.evidence.outputs.evidence_dir }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/operator-profile-pr.md"
          cat >"$body" <<EOF
          Phase 56 operator/vendor profile interoperability evidence.

          The raw traffic artifact is intentionally not committed to this public
          repository. The retained branch contains sanitized summary, protocol
          fields, and SHA-256 digests. A maintainer must review the protected raw
          workflow artifact before approving this PR.

          Profile: $PROFILE_ID
          Retained sanitized evidence: $EVIDENCE_DIR
          Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Merging this evidence PR does not automatically modify the stable
          manifest. Gate promotion remains a separate reviewed action.
          EOF
          gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$BRANCH"             --title "evidence: retain operator profile run $GITHUB_RUN_ID"             --body-file "$body"
