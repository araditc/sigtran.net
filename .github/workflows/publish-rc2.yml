name: publish-rc2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-sigtran-net-1.0.0-rc.2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: nuget-prerelease
    env:
      TAG_NAME: v1.0.0-rc.2
      RELEASE_VERSION: 1.0.0-rc.2
      EXPECTED_TARGET_SHA: e2c663460823cd29f073467a79c4f761fb7c1002
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Checkout exact RC tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.0-rc.2
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          resolved="$(git rev-list -n 1 "$TAG_NAME")"
          test "$resolved" = "$EXPECTED_TARGET_SHA"

      - name: Restore build test
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Sigtran.NET.sln
          dotnet build src/Sigtran.NET.sln --configuration Release --no-restore
          dotnet run --project src/Sigtran.NET.Tests/Sigtran.NET.Tests.csproj --configuration Release --no-build

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          dotnet pack src/Sigtran.NET/Sigtran.NET.csproj --configuration Release --no-build /p:Version="$RELEASE_VERSION"
          mkdir -p artifacts/release
          cp "src/Sigtran.NET/bin/Release/Sigtran.NET.$RELEASE_VERSION.nupkg" artifacts/release/
          cp "src/Sigtran.NET/bin/Release/Sigtran.NET.$RELEASE_VERSION.snupkg" artifacts/release/
          sha256sum artifacts/release/* > "artifacts/release/Sigtran.NET.$RELEASE_VERSION.sha256"

      - name: Publish to NuGet.org if needed
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          package_url="https://api.nuget.org/v3-flatcontainer/sigtran.net/$RELEASE_VERSION/sigtran.net.$RELEASE_VERSION.nupkg"
          if curl --fail --silent "$package_url" -o /dev/null; then
            echo "Package is already public; skipping push."
          else
            test -n "$NUGET_API_KEY"
            dotnet nuget push "artifacts/release/Sigtran.NET.$RELEASE_VERSION.nupkg" --source "$NUGET_SOURCE" --api-key "$NUGET_API_KEY" --skip-duplicate
          fi

      - name: Verify public visibility and restore
        shell: bash
        run: |
          set -euo pipefail
          package_url="https://api.nuget.org/v3-flatcontainer/sigtran.net/$RELEASE_VERSION/sigtran.net.$RELEASE_VERSION.nupkg"
          for attempt in $(seq 1 36); do
            if curl --fail --silent "$package_url" -o /dev/null; then
              break
            fi
            if [ "$attempt" = "36" ]; then
              echo "NuGet package did not become visible in time." >&2
              exit 1
            fi
            sleep 10
          done
          restore_dir="$RUNNER_TEMP/public-restore"
          dotnet new classlib --framework net10.0 --output "$restore_dir"
          dotnet add "$restore_dir" package Sigtran.NET --version "$RELEASE_VERSION" --source "$NUGET_SOURCE"
          {
            echo "# Sigtran.NET $RELEASE_VERSION publication evidence"
            echo
            echo "- Tag: `$TAG_NAME`"
            echo "- Source commit: `$EXPECTED_TARGET_SHA`"
            echo "- Workflow run: `$GITHUB_RUN_ID`"
            echo "- NuGet visibility: PASS"
            echo "- Fresh .NET 10 restore: PASS"
            echo "- Verified UTC: `$(date -u +%Y-%m-%dT%H:%M:%SZ)`"
          } > artifacts/release/NUGET_PRERELEASE_PUBLISH_RC2.md

      - name: Attach package and evidence to GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME" artifacts/release/* --repo "$GITHUB_REPOSITORY" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigtran-rc2-publication
          path: artifacts/release
          retention-days: 90
