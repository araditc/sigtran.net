name: publish-rc2-oidc

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-rc2-oidc.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-sigtran-net-1.0.0-rc.2-oidc
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: nuget-prerelease

    env:
      TAG_NAME: v1.0.0-rc.2
      RELEASE_VERSION: 1.0.0-rc.2
      EXPECTED_TARGET_SHA: e2c663460823cd29f073467a79c4f761fb7c1002
      NUGET_SOURCE: https://api.nuget.org/v3/index.json

    steps:
      - name: Checkout exact RC tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v1.0.0-rc.2
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate trusted-publishing configuration
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          set -euo pipefail
          test -n "$NUGET_USER" || {
            echo "Missing NUGET_USER secret. Set it to the NuGet.org profile name, not an email address." >&2
            exit 1
          }
          resolved="$(git rev-list -n 1 "$TAG_NAME")"
          test "$resolved" = "$EXPECTED_TARGET_SHA"

      - name: Restore build test pack
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Sigtran.NET.sln
          dotnet build src/Sigtran.NET.sln --configuration Release --no-restore
          dotnet run --project src/Sigtran.NET.Tests/Sigtran.NET.Tests.csproj --configuration Release --no-build
          dotnet pack src/Sigtran.NET/Sigtran.NET.csproj             --configuration Release             --no-build             /p:Version="$RELEASE_VERSION"
          mkdir -p artifacts/release
          cp "src/Sigtran.NET/bin/Release/Sigtran.NET.$RELEASE_VERSION.nupkg" artifacts/release/
          cp "src/Sigtran.NET/bin/Release/Sigtran.NET.$RELEASE_VERSION.snupkg" artifacts/release/

      - name: Check current NuGet visibility
        id: precheck
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.nuget.org/v3-flatcontainer/sigtran.net/$RELEASE_VERSION/sigtran.net.$RELEASE_VERSION.nupkg"
          if curl --fail --silent "$url" -o /dev/null; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: NuGet login with OIDC
        if: ${{ steps.precheck.outputs.already_published != 'true' }}
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        if: ${{ steps.precheck.outputs.already_published != 'true' }}
        shell: bash
        env:
          TEMP_NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push             "artifacts/release/Sigtran.NET.$RELEASE_VERSION.nupkg"             --source "$NUGET_SOURCE"             --api-key "$TEMP_NUGET_API_KEY"             --skip-duplicate

      - name: Verify public visibility and restore
        shell: bash
        run: |
          set -euo pipefail
          package_url="https://api.nuget.org/v3-flatcontainer/sigtran.net/$RELEASE_VERSION/sigtran.net.$RELEASE_VERSION.nupkg"

          for attempt in $(seq 1 36); do
            if curl --fail --silent "$package_url" -o /dev/null; then
              break
            fi
            if [ "$attempt" = "36" ]; then
              echo "NuGet package did not become visible in time." >&2
              exit 1
            fi
            sleep 10
          done

          restore_dir="$RUNNER_TEMP/sigtran-rc2-oidc-restore"
          dotnet new classlib --framework net10.0 --output "$restore_dir"
          dotnet add "$restore_dir" package Sigtran.NET             --version "$RELEASE_VERSION"             --source "$NUGET_SOURCE"

          mkdir -p artifacts/evidence
          {
            echo "# Sigtran.NET $RELEASE_VERSION Trusted Publishing evidence"
            echo
            echo "- GitHub tag: `$TAG_NAME`"
            echo "- Source commit: `$EXPECTED_TARGET_SHA`"
            echo "- Workflow: `publish-rc2-oidc.yml`"
            echo "- Workflow run: `$GITHUB_RUN_ID`"
            echo "- NuGet Trusted Publishing/OIDC: PASS"
            echo "- Public NuGet visibility: PASS"
            echo "- Fresh .NET 10 restore: PASS"
            echo "- Verified UTC: `$(date -u +%Y-%m-%dT%H:%M:%SZ)`"
          } > artifacts/evidence/NUGET_RC2_TRUSTED_PUBLISHING.md

      - name: Upload publication evidence to GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG_NAME"             artifacts/evidence/NUGET_RC2_TRUSTED_PUBLISHING.md             --repo "$GITHUB_REPOSITORY"             --clobber

      - name: Refresh GitHub prerelease notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:docs/releases/v1.0.0-rc.2.md > "$RUNNER_TEMP/rc2-release-notes.md"
          gh release edit "$TAG_NAME"             --repo "$GITHUB_REPOSITORY"             --title "SIGTRAN.NET v1.0.0-rc.2 — .NET 10 SIGTRAN/SS7-over-IP Release Candidate"             --notes-file "$RUNNER_TEMP/rc2-release-notes.md"             --prerelease

      - name: Upload workflow evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sigtran-rc2-trusted-publishing-evidence
          path: artifacts/evidence
          retention-days: 90
