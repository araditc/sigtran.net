name: phase56-kubernetes-sctp

on:
  workflow_dispatch:
    inputs:
      image:
        description: Digest-pinned operations-host image (name@sha256:...)
        required: true
        type: string
      namespace:
        description: Kubernetes namespace for qualification
        required: true
        default: sigtran-phase56
        type: string
      network_profile:
        description: Pod data-path profile under qualification
        required: true
        default: cni
        type: choice
        options:
          - cni
          - hostNetwork
      matrix_profile:
        description: Qualification matrix depth
        required: true
        default: core
        type: choice
        options:
          - core
          - representative
      disruption_confirmation:
        description: Representative only - type "run kubernetes disruptive <namespace>"
        required: false
        type: string
      confirmation:
        description: Type "run kubernetes sctp <namespace>"
        required: true
        type: string

concurrency:
  group: phase56-kubernetes-sctp
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, linux, sigtran-kubernetes-lab]
    environment:
      name: kubernetes-sctp
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      gate_eligible: ${{ steps.finalize.outputs.gate_eligible }}
      run_id: ${{ steps.identity.outputs.run_id }}
    env:
      RUN_ID: phase56-k8s-${{ github.run_id }}-${{ github.run_attempt }}
      SOURCE_SHA: ${{ github.sha }}
      K8S_NAMESPACE: ${{ inputs.namespace }}
      K8S_IMAGE: ${{ inputs.image }}
      K8S_NETWORK_PROFILE: ${{ inputs.network_profile }}
      K8S_MATRIX_PROFILE: ${{ inputs.matrix_profile }}
      K8S_DRAIN_NODE_LABEL: ${{ vars.K8S_DRAIN_NODE_LABEL || 'sigtran.net/qualification-drain=true' }}
      REMOTE_IP: ${{ secrets.K8S_REMOTE_IP }}
      REMOTE_PORT: ${{ secrets.K8S_REMOTE_PORT }}
      LOCAL_POINT_CODE: ${{ vars.K8S_LOCAL_POINT_CODE || '1' }}
      REMOTE_POINT_CODE: ${{ vars.K8S_REMOTE_POINT_CODE || '2' }}
      NETWORK_INDICATOR: ${{ vars.K8S_NETWORK_INDICATOR || '2' }}
      ASP_IDENTIFIER: ${{ vars.K8S_ASP_IDENTIFIER || '42' }}
      ROUTING_CONTEXT: ${{ vars.K8S_ROUTING_CONTEXT || '100' }}
      RAW_EVIDENCE_ROOT: ${{ vars.K8S_RAW_EVIDENCE_ROOT }}
      K8S_CNI_NAMESPACE: ${{ vars.K8S_CNI_NAMESPACE || 'kube-system' }}
      K8S_CNI_DAEMONSET: ${{ vars.K8S_CNI_DAEMONSET }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate protected cluster configuration
        shell: bash
        env:
          QUALIFICATION_CONFIRMATION: ${{ inputs.confirmation }}
          DISRUPTION_CONFIRMATION: ${{ inputs.disruption_confirmation }}
        run: |
          set -euo pipefail
          test "$QUALIFICATION_CONFIRMATION" = "run kubernetes sctp $K8S_NAMESPACE"
          [[ "$K8S_NAMESPACE" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$REMOTE_IP"
          test -n "$REMOTE_PORT"
          test -n "$RAW_EVIDENCE_ROOT"
          test -n "$K8S_CNI_DAEMONSET"
          test -n "$K8S_CNI_NAMESPACE"
          for cmd in kubectl curl sha256sum python3 base64 mktemp; do
            command -v "$cmd" >/dev/null
          done
          python3 scripts/render-kubernetes-deployment.py --image "$K8S_IMAGE"
          python3 - "$REMOTE_IP" "$REMOTE_PORT" <<'PY'
          import ipaddress, sys
          address=ipaddress.ip_address(sys.argv[1])
          if address.is_loopback or address.is_unspecified or address.is_multicast:
              raise SystemExit("K8S_REMOTE_IP must identify a representative non-local peer")
          port=int(sys.argv[2])
          if port < 1 or port > 65535:
              raise SystemExit("K8S_REMOTE_PORT must be between 1 and 65535")
          PY
          if [[ "$K8S_MATRIX_PROFILE" == "representative" ]]; then
            test "$K8S_NETWORK_PROFILE" = "cni"
            test "$DISRUPTION_CONFIRMATION" = "run kubernetes disruptive $K8S_NAMESPACE"
            [[ "$K8S_DRAIN_NODE_LABEL" =~ ^[A-Za-z0-9./_-]+=[A-Za-z0-9._-]+$ ]]
            policy_check="$RUNNER_TEMP/sigtran-network-policy-validation.json"
            python3 scripts/render-kubernetes-network-policy.py \
              --namespace "$K8S_NAMESPACE" \
              --remote-ip "$REMOTE_IP" \
              --remote-port "$REMOTE_PORT" \
              --mode allow \
              --output "$policy_check"
            rm -f "$policy_check"
          fi

      - name: Configure private kubectl credentials
        shell: bash
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KUBECONFIG_B64"
          kube_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/sigtran-kubeconfig.XXXXXXXXXX")"
          kubeconfig="$kube_dir/config"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$kubeconfig"
          chmod 600 "$kubeconfig"
          unset KUBECONFIG_B64
          echo "KUBECONFIG=$kubeconfig" >> "$GITHUB_ENV"
          echo "KUBECONFIG_DIR=$kube_dir" >> "$GITHUB_ENV"

      - name: Prepare private evidence scratch
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          scratch="$(mktemp -d "${RUNNER_TEMP:-/tmp}/sigtran-k8s.XXXXXXXXXX")"
          mkdir -m 700 "$scratch/raw" "$scratch/safe"
          echo "EVIDENCE_SCRATCH=$scratch" >> "$GITHUB_ENV"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Capture cluster and CNI identity
        id: cluster
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          kubectl version -o json > "$raw/kube-version.json"
          kubectl get nodes -o json > "$raw/nodes.json"
          kubectl -n "$K8S_CNI_NAMESPACE" get daemonset "$K8S_CNI_DAEMONSET" -o json > "$raw/cni-daemonset.json"

          python3 - "$raw/nodes.json" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1]))
          linux=[
              n for n in value.get("items",[])
              if n.get("status",{}).get("nodeInfo",{}).get("operatingSystem") == "linux"
          ]
          if not linux:
              raise SystemExit("No Linux Kubernetes worker/node evidence was observed")
          PY

      - name: Deploy operations host
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          kubectl get namespace "$K8S_NAMESPACE" >/dev/null 2>&1 || kubectl create namespace "$K8S_NAMESPACE"

          kubectl -n "$K8S_NAMESPACE" create configmap sigtran-node             --from-literal=ASPNETCORE_URLS=http://+:8080             --from-literal=SIGTRAN_REMOTE_IP="$REMOTE_IP"             --from-literal=SIGTRAN_REMOTE_PORT="$REMOTE_PORT"             --from-literal=SIGTRAN_ASP_IDENTIFIER="$ASP_IDENTIFIER"             --from-literal=SIGTRAN_LOCAL_POINT_CODE="$LOCAL_POINT_CODE"             --from-literal=SIGTRAN_REMOTE_POINT_CODE="$REMOTE_POINT_CODE"             --from-literal=SIGTRAN_ROUTING_CONTEXT="$ROUTING_CONTEXT"             --from-literal=SIGTRAN_NETWORK_INDICATOR="$NETWORK_INDICATOR"             --from-literal=SIGTRAN_SERVICE_INDICATOR=3             --from-literal=SIGTRAN_QUEUE_CAPACITY=4096             --dry-run=client -o yaml | kubectl apply -f -

          rendered="$EVIDENCE_SCRATCH/deployment.yaml"
          python3 scripts/render-kubernetes-deployment.py \
            --template deploy/kubernetes/deployment.yaml \
            --output "$rendered" \
            --image "$K8S_IMAGE"
          kubectl -n "$K8S_NAMESPACE" apply -f "$rendered"

          if [[ "$K8S_NETWORK_PROFILE" == "hostNetwork" ]]; then
            kubectl -n "$K8S_NAMESPACE" patch deployment sigtran-node --type merge -p               '{"spec":{"template":{"spec":{"hostNetwork":true,"dnsPolicy":"ClusterFirstWithHostNet"}}}}'
          else
            kubectl -n "$K8S_NAMESPACE" patch deployment sigtran-node --type json -p               '[{"op":"remove","path":"/spec/template/spec/hostNetwork"}]' >/dev/null 2>&1 || true
          fi

          kubectl -n "$K8S_NAMESPACE" rollout status deployment/sigtran-node --timeout=10m
          kubectl -n "$K8S_NAMESPACE" get deployment sigtran-node -o json > "$raw/deployment.json"

      - name: Capture initial readiness and SCTP state
        id: initial
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          kubectl -n "$K8S_NAMESPACE" wait             --for=condition=Ready pod             -l app.kubernetes.io/name=sigtran-node             --timeout=10m

          pod="$(kubectl -n "$K8S_NAMESPACE" get pods             -l app.kubernetes.io/name=sigtran-node             -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          kubectl -n "$K8S_NAMESPACE" get pod "$pod" -o json > "$raw/pod-initial.json"
          kubectl -n "$K8S_NAMESPACE" logs "$pod" > "$raw/pod-initial.log"
          kubectl -n "$K8S_NAMESPACE" exec "$pod" -- sh -c 'cat /proc/net/sctp/assocs' > "$raw/sctp-assocs.txt"
          awk 'NR > 1 && NF > 0 { found=1 } END { exit(found ? 0 : 1) }' "$raw/sctp-assocs.txt"

          kubectl -n "$K8S_NAMESPACE" port-forward "pod/$pod" 18080:8080             > "$raw/port-forward-initial.log" 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18080/health/live > "$raw/live.json"               && curl --fail --silent http://127.0.0.1:18080/health/ready > "$raw/ready.json"               && curl --fail --silent http://127.0.0.1:18080/metrics > "$raw/metrics.txt"; then
              break
            fi
            sleep 1
          done
          test -s "$raw/live.json"
          test -s "$raw/ready.json"
          test -s "$raw/metrics.txt"
          kill "$pf_pid" 2>/dev/null || true
          wait "$pf_pid" 2>/dev/null || true
          trap - EXIT

      - name: Verify management service exposure
        id: service_exposure
        if: inputs.matrix_profile == 'representative'
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          kubectl -n "$K8S_NAMESPACE" get service sigtran-node-management -o json > "$raw/service.json"
          kubectl -n "$K8S_NAMESPACE" get endpointslice \
            -l kubernetes.io/service-name=sigtran-node-management \
            -o json > "$raw/service-endpoints.json"

          kubectl -n "$K8S_NAMESPACE" port-forward service/sigtran-node-management 18082:8080 \
            > "$raw/service-port-forward.log" 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18082/health/ready \
              > "$raw/service-ready.json"; then
              break
            fi
            sleep 1
          done
          test -s "$raw/service-ready.json"
          kill "$pf_pid" 2>/dev/null || true
          wait "$pf_pid" 2>/dev/null || true
          trap - EXIT

          python3 - "$raw/service.json" "$raw/service-endpoints.json" \
            "$raw/service-ready.json" "$raw/service-exposure.json" "$SOURCE_SHA" <<'PY'
          import json, sys
          service_path,endpoints_path,ready_path,out_path,source=sys.argv[1:]
          service=json.load(open(service_path))
          endpoints=json.load(open(endpoints_path))
          ready=json.load(open(ready_path))
          selector=service.get("spec",{}).get("selector",{})
          ports=service.get("spec",{}).get("ports",[])
          endpoint_count=sum(
              len(item.get("endpoints",[]))
              for item in endpoints.get("items",[])
          )
          passed=(
              selector.get("app.kubernetes.io/name") == "sigtran-node"
              and any(p.get("port")==8080 for p in ports)
              and endpoint_count > 0
              and str(ready.get("status","")).lower() == "healthy"
          )
          json.dump({
              "schemaVersion":1,
              "sourceSha":source,
              "managementServiceType":service.get("spec",{}).get("type","ClusterIP"),
              "readyEndpointCount":endpoint_count,
              "passed":passed,
          }, open(out_path,"w"), indent=2)
          if not passed:
              raise SystemExit("management service exposure evidence failed")
          PY

      - name: Qualify CNI SCTP NetworkPolicy enforcement and recovery
        id: network_policy
        if: inputs.matrix_profile == 'representative'
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          allow="$raw/network-policy-allow.json"
          deny="$raw/network-policy-deny.json"
          python3 scripts/render-kubernetes-network-policy.py \
            --namespace "$K8S_NAMESPACE" --remote-ip "$REMOTE_IP" \
            --remote-port "$REMOTE_PORT" --mode allow --output "$allow"
          python3 scripts/render-kubernetes-network-policy.py \
            --namespace "$K8S_NAMESPACE" --remote-ip "$REMOTE_IP" \
            --remote-port "$REMOTE_PORT" --mode deny --output "$deny"

          kubectl apply -f "$allow"
          kubectl -n "$K8S_NAMESPACE" get networkpolicy sigtran-node-sctp-egress \
            -o json > "$raw/network-policy-observed.json"

          pod="$(kubectl -n "$K8S_NAMESPACE" get pods \
            -l app.kubernetes.io/name=sigtran-node \
            -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          kubectl -n "$K8S_NAMESPACE" port-forward "pod/$pod" 18083:8080 \
            > "$raw/network-policy-port-forward.log" 2>&1 &
          pf_pid=$!
          cleanup_policy() {
            kubectl apply -f "$allow" >/dev/null 2>&1 || true
            kill "$pf_pid" 2>/dev/null || true
          }
          trap cleanup_policy EXIT

          curl --fail --silent http://127.0.0.1:18083/health/ready \
            > "$raw/network-policy-ready-before.json"
          kubectl apply -f "$deny"

          denied=false
          for _ in $(seq 1 120); do
            code="$(curl --silent --output "$raw/network-policy-ready-denied.json" \
              --write-out '%{http_code}' http://127.0.0.1:18083/health/ready || true)"
            if [[ "$code" == "503" ]]; then
              denied=true
              break
            fi
            sleep 1
          done

          kubectl apply -f "$allow"
          recovered=false
          for _ in $(seq 1 180); do
            if curl --fail --silent http://127.0.0.1:18083/health/ready \
              > "$raw/network-policy-ready-recovered.json"; then
              recovered=true
              break
            fi
            sleep 1
          done

          kubectl -n "$K8S_NAMESPACE" exec "$pod" -- sh -c \
            'cat /proc/net/sctp/assocs' > "$raw/sctp-assocs-after-network-policy.txt"
          association=false
          if awk 'NR > 1 && NF > 0 { found=1 } END { exit(found ? 0 : 1) }' \
            "$raw/sctp-assocs-after-network-policy.txt"; then
            association=true
          fi

          kill "$pf_pid" 2>/dev/null || true
          wait "$pf_pid" 2>/dev/null || true
          trap - EXIT

          python3 - "$raw/network-policy.json" "$SOURCE_SHA" \
            "$denied" "$recovered" "$association" <<'PY'
          import json, sys
          path,source,denied,recovered,association=sys.argv[1:]
          passed=denied=="true" and recovered=="true" and association=="true"
          json.dump({
              "schemaVersion":1,
              "sourceSha":source,
              "denyObserved":denied=="true",
              "recoveryObserved":recovered=="true",
              "sctpAssociationRecovered":association=="true",
              "passed":passed,
          }, open(path,"w"), indent=2)
          if not passed:
              raise SystemExit("SCTP NetworkPolicy enforcement/recovery evidence failed")
          PY

      - name: Qualify graceful pod termination
        id: graceful
        if: inputs.matrix_profile == 'representative'
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          pod="$(kubectl -n "$K8S_NAMESPACE" get pods \
            -l app.kubernetes.io/name=sigtran-node \
            -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          kubectl -n "$K8S_NAMESPACE" get pod "$pod" -o json \
            > "$raw/graceful-pod-before.json"
          kubectl -n "$K8S_NAMESPACE" logs -f "$pod" \
            > "$raw/graceful-termination.log" 2>&1 &
          log_pid=$!

          started="$(date +%s)"
          kubectl -n "$K8S_NAMESPACE" delete pod "$pod" \
            --grace-period=30 --wait=true
          completed="$(date +%s)"
          duration=$((completed - started))
          wait "$log_pid" 2>/dev/null || true

          shutdown=false
          if grep -q '"EventName":"m3ua.shutdown.completed"' \
            "$raw/graceful-termination.log"; then
            shutdown=true
          fi

          kubectl -n "$K8S_NAMESPACE" rollout status deployment/sigtran-node --timeout=10m
          kubectl -n "$K8S_NAMESPACE" wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=sigtran-node --timeout=10m
          replacement="$(kubectl -n "$K8S_NAMESPACE" get pods \
            -l app.kubernetes.io/name=sigtran-node \
            -o jsonpath='{.items[0].metadata.name}')"
          replacement_ready=false
          if [[ -n "$replacement" && "$replacement" != "$pod" ]]; then
            replacement_ready=true
          fi

          python3 - "$raw/graceful-termination.json" "$SOURCE_SHA" \
            "$duration" "$shutdown" "$replacement_ready" <<'PY'
          import json, sys
          path,source,duration,shutdown,replacement=sys.argv[1:]
          duration=int(duration)
          passed=duration <= 35 and shutdown=="true" and replacement=="true"
          json.dump({
              "schemaVersion":1,
              "sourceSha":source,
              "terminationGracePeriodSeconds":30,
              "observedTerminationSeconds":duration,
              "shutdownEventObserved":shutdown=="true",
              "replacementReady":replacement=="true",
              "passed":passed,
          }, open(path,"w"), indent=2)
          if not passed:
              raise SystemExit("graceful termination evidence failed")
          PY

      - name: Verify PodDisruptionBudget
        id: pdb
        if: inputs.matrix_profile == 'representative'
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          kubectl -n "$K8S_NAMESPACE" apply \
            -f deploy/kubernetes/pod-disruption-budget.yaml

          ready=false
          for _ in $(seq 1 60); do
            kubectl -n "$K8S_NAMESPACE" get pdb sigtran-node -o json > "$raw/pdb-observed.json"
            if python3 - "$raw/pdb-observed.json" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1]))
          spec=value.get("spec",{})
          status=value.get("status",{})
          ok=(
              spec.get("maxUnavailable") == 1
              and status.get("currentHealthy",0) >= 1
              and status.get("expectedPods",0) >= 1
              and status.get("disruptionsAllowed",0) >= 1
          )
          raise SystemExit(0 if ok else 1)
          PY
            then
              ready=true
              break
            fi
            sleep 1
          done

          python3 - "$raw/pdb-observed.json" "$raw/pdb.json" "$SOURCE_SHA" "$ready" <<'PY'
          import json, sys
          observed_path,out_path,source,ready=sys.argv[1:]
          observed=json.load(open(observed_path))
          json.dump({
              "schemaVersion":1,
              "sourceSha":source,
              "maxUnavailable":observed.get("spec",{}).get("maxUnavailable"),
              "disruptionsAllowed":observed.get("status",{}).get("disruptionsAllowed"),
              "passed":ready=="true",
          }, open(out_path,"w"), indent=2)
          if ready != "true":
              raise SystemExit("PodDisruptionBudget never became eligible for the qualification pod")
          PY

      - name: Verify pod restart and rollout rollback
        id: rollout
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          old_pod="$(kubectl -n "$K8S_NAMESPACE" get pods             -l app.kubernetes.io/name=sigtran-node             -o jsonpath='{.items[0].metadata.name}')"
          before_hash="$(kubectl -n "$K8S_NAMESPACE" get pod "$old_pod"             -o jsonpath='{.metadata.labels.pod-template-hash}')"
          test -n "$before_hash"

          kubectl -n "$K8S_NAMESPACE" delete pod "$old_pod" --wait=false
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/sigtran-node --timeout=10m
          kubectl -n "$K8S_NAMESPACE" wait             --for=condition=Ready pod             -l app.kubernetes.io/name=sigtran-node             --timeout=10m

          restart_pod="$(kubectl -n "$K8S_NAMESPACE" get pods             -l app.kubernetes.io/name=sigtran-node             -o jsonpath='{.items[0].metadata.name}')"
          test "$restart_pod" != "$old_pod"

          token="$(date -u +%Y%m%dT%H%M%SZ)"
          kubectl -n "$K8S_NAMESPACE" patch deployment sigtran-node --type merge -p             '{"spec":{"template":{"metadata":{"annotations":{"phase56.sigtran.net/rollout-token":"'"$token"'"}}}}}'
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/sigtran-node --timeout=10m
          rollout_pod="$(kubectl -n "$K8S_NAMESPACE" get pods             -l app.kubernetes.io/name=sigtran-node             -o jsonpath='{.items[0].metadata.name}')"
          rollout_hash="$(kubectl -n "$K8S_NAMESPACE" get pod "$rollout_pod"             -o jsonpath='{.metadata.labels.pod-template-hash}')"
          test -n "$rollout_hash"
          test "$rollout_hash" != "$before_hash"
          kubectl -n "$K8S_NAMESPACE" rollout history deployment/sigtran-node > "$raw/rollout-history-after.txt"

          kubectl -n "$K8S_NAMESPACE" rollout undo deployment/sigtran-node
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/sigtran-node --timeout=10m
          kubectl -n "$K8S_NAMESPACE" wait             --for=condition=Ready pod             -l app.kubernetes.io/name=sigtran-node             --timeout=10m
          rollback_pod="$(kubectl -n "$K8S_NAMESPACE" get pods             -l app.kubernetes.io/name=sigtran-node             -o jsonpath='{.items[0].metadata.name}')"
          rollback_hash="$(kubectl -n "$K8S_NAMESPACE" get pod "$rollback_pod"             -o jsonpath='{.metadata.labels.pod-template-hash}')"
          test "$rollback_hash" = "$before_hash"
          kubectl -n "$K8S_NAMESPACE" rollout history deployment/sigtran-node > "$raw/rollout-history-rollback.txt"

          python3 - "$raw/rollout-rollback.json" "$SOURCE_SHA"             "$before_hash" "$rollout_hash" "$rollback_hash" <<'PY'
          import json, sys
          path,source,before,rolled,rollback=sys.argv[1:]
          json.dump({
              "schemaVersion":1,
              "sourceSha":source,
              "beforeTemplateHash":before,
              "rolloutTemplateHash":rolled,
              "rollbackTemplateHash":rollback,
              "passed": bool(before and rolled != before and rollback == before),
          }, open(path,"w"), indent=2)
          PY

      - name: Qualify node drain and rescheduling
        id: node_drain
        if: inputs.matrix_profile == 'representative'
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          pod="$(kubectl -n "$K8S_NAMESPACE" get pods \
            -l app.kubernetes.io/name=sigtran-node \
            -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          node="$(kubectl -n "$K8S_NAMESPACE" get pod "$pod" -o jsonpath='{.spec.nodeName}')"
          test -n "$node"
          kubectl get node "$node" -l "$K8S_DRAIN_NODE_LABEL" -o name | grep -q .

          kubectl get node "$node" -o json > "$raw/drain-node-before.json"
          kubectl get nodes -o json > "$raw/drain-nodes.json"
          python3 - "$raw/drain-node-before.json" "$raw/drain-nodes.json" "$node" <<'PY'
          import json, sys
          current=json.load(open(sys.argv[1]))
          nodes=json.load(open(sys.argv[2]))
          current_name=sys.argv[3]
          labels=current.get("metadata",{}).get("labels",{})
          if "node-role.kubernetes.io/control-plane" in labels or "node-role.kubernetes.io/master" in labels:
              raise SystemExit("qualification drain node must not be a control-plane node")
          candidates=[]
          for node in nodes.get("items",[]):
              name=node.get("metadata",{}).get("name")
              if name == current_name or node.get("spec",{}).get("unschedulable") is True:
                  continue
              ready=any(
                  condition.get("type")=="Ready" and condition.get("status")=="True"
                  for condition in node.get("status",{}).get("conditions",[])
              )
              linux=node.get("status",{}).get("nodeInfo",{}).get("operatingSystem")=="linux"
              if ready and linux:
                  candidates.append(name)
          if not candidates:
              raise SystemExit("node-drain qualification requires another schedulable Ready Linux node")
          PY

          restore_node() {
            kubectl uncordon "$node" >/dev/null 2>&1 || true
          }
          trap restore_node EXIT
          kubectl drain "$node" \
            --ignore-daemonsets \
            --delete-emptydir-data \
            --pod-selector='app.kubernetes.io/name=sigtran-node' \
            --grace-period=30 \
            --timeout=10m

          kubectl -n "$K8S_NAMESPACE" rollout status deployment/sigtran-node --timeout=10m
          kubectl -n "$K8S_NAMESPACE" wait --for=condition=Ready pod \
            -l app.kubernetes.io/name=sigtran-node --timeout=10m
          replacement="$(kubectl -n "$K8S_NAMESPACE" get pods \
            -l app.kubernetes.io/name=sigtran-node \
            -o jsonpath='{.items[0].metadata.name}')"
          replacement_node="$(kubectl -n "$K8S_NAMESPACE" get pod "$replacement" \
            -o jsonpath='{.spec.nodeName}')"
          test -n "$replacement_node"
          test "$replacement_node" != "$node"

          kubectl uncordon "$node"
          trap - EXIT
          kubectl get node "$node" -o json > "$raw/drain-node-after.json"
          kubectl -n "$K8S_NAMESPACE" get pod "$replacement" -o json \
            > "$raw/drain-replacement-pod.json"

          python3 - "$raw/node-drain.json" "$SOURCE_SHA" "$node" "$replacement_node" \
            "$raw/drain-node-after.json" <<'PY'
          import json, sys
          path,source,original,replacement,node_after_path=sys.argv[1:]
          node_after=json.load(open(node_after_path))
          uncordoned=node_after.get("spec",{}).get("unschedulable") is not True
          passed=original != replacement and uncordoned
          json.dump({
              "schemaVersion":1,
              "sourceSha":source,
              "rescheduledToDifferentNode":original != replacement,
              "originalNodeRestoredSchedulable":uncordoned,
              "passed":passed,
          }, open(path,"w"), indent=2)
          if not passed:
              raise SystemExit("node drain/rescheduling evidence failed")
          PY

      - name: Capture final readiness and SCTP state
        id: final_capture
        shell: bash
        run: |
          set -euo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          pod="$(kubectl -n "$K8S_NAMESPACE" get pods             -l app.kubernetes.io/name=sigtran-node             -o jsonpath='{.items[0].metadata.name}')"
          test -n "$pod"
          kubectl -n "$K8S_NAMESPACE" get pod "$pod" -o json > "$raw/pod-final.json"
          kubectl -n "$K8S_NAMESPACE" logs "$pod" > "$raw/pod-final.log"
          kubectl -n "$K8S_NAMESPACE" exec "$pod" -- sh -c 'cat /proc/net/sctp/assocs' > "$raw/sctp-assocs-final.txt"
          awk 'NR > 1 && NF > 0 { found=1 } END { exit(found ? 0 : 1) }' "$raw/sctp-assocs-final.txt"

          kubectl -n "$K8S_NAMESPACE" port-forward "pod/$pod" 18081:8080             > "$raw/port-forward-final.log" 2>&1 &
          pf_pid=$!
          trap 'kill "$pf_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18081/health/live > "$raw/live-final.json"               && curl --fail --silent http://127.0.0.1:18081/health/ready > "$raw/ready-final.json"               && curl --fail --silent http://127.0.0.1:18081/metrics > "$raw/metrics-final.txt"; then
              break
            fi
            sleep 1
          done
          test -s "$raw/live-final.json"
          test -s "$raw/ready-final.json"
          test -s "$raw/metrics-final.txt"
          kill "$pf_pid" 2>/dev/null || true
          wait "$pf_pid" 2>/dev/null || true
          trap - EXIT

      - name: Finalize and persist evidence
        id: finalize
        if: always() && steps.identity.outcome == 'success'
        shell: bash
        env:
          CLUSTER_OUTCOME: ${{ steps.cluster.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          INITIAL_OUTCOME: ${{ steps.initial.outcome }}
          SERVICE_EXPOSURE_OUTCOME: ${{ steps.service_exposure.outcome }}
          NETWORK_POLICY_OUTCOME: ${{ steps.network_policy.outcome }}
          GRACEFUL_OUTCOME: ${{ steps.graceful.outcome }}
          PDB_OUTCOME: ${{ steps.pdb.outcome }}
          ROLLOUT_OUTCOME: ${{ steps.rollout.outcome }}
          NODE_DRAIN_OUTCOME: ${{ steps.node_drain.outcome }}
          FINAL_CAPTURE_OUTCOME: ${{ steps.final_capture.outcome }}
        run: |
          set -uo pipefail
          raw="$EVIDENCE_SCRATCH/raw"
          safe="$EVIDENCE_SCRATCH/safe"

          python3 - "$raw/qualification-steps.json" \
            "$SOURCE_SHA" "$K8S_MATRIX_PROFILE" \
            "$CLUSTER_OUTCOME" "$DEPLOY_OUTCOME" "$INITIAL_OUTCOME" \
            "$SERVICE_EXPOSURE_OUTCOME" "$NETWORK_POLICY_OUTCOME" \
            "$GRACEFUL_OUTCOME" "$PDB_OUTCOME" "$ROLLOUT_OUTCOME" \
            "$NODE_DRAIN_OUTCOME" "$FINAL_CAPTURE_OUTCOME" <<'PY'
          import json, sys
          (
              path, source, profile, cluster, deploy, initial, service_exposure,
              network_policy, graceful, pdb, rollout, node_drain, final_capture
          ) = sys.argv[1:]
          value = {
              "schemaVersion": 1,
              "sourceSha": source,
              "matrixProfile": profile,
              "steps": {
                  "cluster": cluster,
                  "deploy": deploy,
                  "initial": initial,
                  "serviceExposure": service_exposure,
                  "networkPolicy": network_policy,
                  "gracefulTermination": graceful,
                  "podDisruptionBudget": pdb,
                  "rollout": rollout,
                  "nodeDrain": node_drain,
                  "finalCapture": final_capture,
              },
          }
          json.dump(value, open(path, "w"), indent=2)
          PY

          workflow_steps_ok=true
          for outcome in \
            "$CLUSTER_OUTCOME" "$DEPLOY_OUTCOME" "$INITIAL_OUTCOME" \
            "$ROLLOUT_OUTCOME" "$FINAL_CAPTURE_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              workflow_steps_ok=false
            fi
          done
          if [[ "$K8S_MATRIX_PROFILE" == "representative" ]]; then
            for outcome in \
              "$SERVICE_EXPOSURE_OUTCOME" "$NETWORK_POLICY_OUTCOME" \
              "$GRACEFUL_OUTCOME" "$PDB_OUTCOME" "$NODE_DRAIN_OUTCOME"; do
              if [[ "$outcome" != "success" ]]; then
                workflow_steps_ok=false
              fi
            done
          fi

          validator_status=0
          if python3 scripts/validate-kubernetes-sctp-evidence.py \
            --raw-root "$raw" \
            --safe-root "$safe" \
            --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" \
            --network-profile "$K8S_NETWORK_PROFILE" \
            --image "$K8S_IMAGE"; then
            validator_status=0
          else
            validator_status=$?
          fi

          (
            cd "$raw"
            find . -type f -print0 | sort -z | xargs -0 -r sha256sum
          ) > "$safe/raw-evidence.sha256"
          (
            cd "$safe"
            find . -type f ! -name sha256.txt -print0 | sort -z | xargs -0 -r sha256sum
          ) > "$safe/sha256.txt"

          gate_eligible=false
          if [[ "$validator_status" -eq 0 && "$workflow_steps_ok" == "true" ]]; then
            gate_eligible="$(python3 - "$safe/summary.json" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1]))
          print("true" if value.get("gateEligible") is True else "false")
          PY
            )"
          fi
          echo "gate_eligible=$gate_eligible" >> "$GITHUB_OUTPUT"

          persist_status=0
          if python3 scripts/persist-qualification-evidence.py \
            "$EVIDENCE_SCRATCH" "$RAW_EVIDENCE_ROOT/$RUN_ID"; then
            persist_status=0
          else
            persist_status=$?
          fi

          {
            echo "### Kubernetes SCTP qualification"
            echo
            echo "- Source: `$SOURCE_SHA`"
            echo "- Network profile: `$K8S_NETWORK_PROFILE`"
            echo "- Matrix profile: `$K8S_MATRIX_PROFILE`"
            echo "- Capture stages complete: `$workflow_steps_ok`"
            if [[ "$validator_status" -eq 0 ]]; then
              echo "- Core evidence validation: PASS"
            else
              echo "- Core evidence validation: FAIL"
            fi
            if [[ "$persist_status" -eq 0 ]]; then
              echo "- Protected evidence persistence: PASS"
            else
              echo "- Protected evidence persistence: FAIL; private scratch retained"
            fi
            echo "- Stable gate eligible: `$gate_eligible`"
            if [[ "$gate_eligible" != "true" ]]; then
              echo "- Remaining matrix evidence is intentionally OPEN; no public evidence PR will be created."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$persist_status" -ne 0 ]]; then
            exit "$persist_status"
          fi
          if [[ "$workflow_steps_ok" != "true" ]]; then
            exit 1
          fi
          exit "$validator_status"

      - name: Cleanup private kubectl material
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -n "${KUBECONFIG_DIR:-}" && -d "$KUBECONFIG_DIR" ]]; then
            rm -rf -- "$KUBECONFIG_DIR"
          fi

  retain-evidence:
    needs: qualify
    if: needs.qualify.result == 'success' && needs.qualify.outputs.gate_eligible == 'true'
    runs-on: [self-hosted, linux, sigtran-kubernetes-lab]
    environment:
      name: kubernetes-sctp
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      RUN_ID: ${{ needs.qualify.outputs.run_id }}
      RAW_EVIDENCE_ROOT: ${{ vars.K8S_RAW_EVIDENCE_ROOT }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify retained gate-eligible evidence
        shell: bash
        run: |
          set -euo pipefail
          safe="$RAW_EVIDENCE_ROOT/$RUN_ID/safe"
          raw="$RAW_EVIDENCE_ROOT/$RUN_ID/raw"
          test -f "$safe/summary.json"
          test -f "$safe/report.md"
          test -f "$safe/raw-evidence.sha256"
          test -f "$safe/sha256.txt"
          python3 - "$safe/summary.json" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1]))
          if value.get("passed") is not True or value.get("gateEligible") is not True:
              raise SystemExit("retained Kubernetes evidence is not gate-eligible")
          PY
          (
            cd "$safe"
            sha256sum -c sha256.txt
          )
          (
            cd "$raw"
            sha256sum -c "$safe/raw-evidence.sha256"
          )

      - name: Retain sanitized evidence branch
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="docs/evidence/PHASE56_KUBERNETES_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          branch="evidence/kubernetes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git fetch origin main
          git checkout -B "$branch" origin/main
          mkdir -p "$evidence_dir"
          cp -a "$RAW_EVIDENCE_ROOT/$RUN_ID/safe/." "$evidence_dir/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$evidence_dir"
          git commit -m "evidence: retain Kubernetes SCTP run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"
          git push origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Open evidence review pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.evidence.outputs.branch }}
          EVIDENCE_DIR: ${{ steps.evidence.outputs.evidence_dir }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/kubernetes-pr.md"
          cat >"$body" <<EOF
          Representative Kubernetes SCTP/CNI evidence candidate.

          Raw cluster logs/manifests remain on protected lab storage. This PR
          contains only sanitized qualification output and digest references.

          Retained evidence: $EVIDENCE_DIR
          Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Merging this PR does not automatically promote the stable manifest gate.
          EOF
          gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$BRANCH"             --title "evidence: retain Kubernetes SCTP run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT"             --body-file "$body"
