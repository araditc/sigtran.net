name: phase56-trusted-signing-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase56-trusted-signing-preflight
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    environment:
      name: nuget-stable
    env:
      RELEASE_VERSION: 1.0.0
      TIMESTAMP_AUTHORITY: ${{ vars.TIMESTAMP_AUTHORITY || 'https://timestamp.sectigo.com' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build test and pack stable candidate
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Sigtran.NET.sln
          dotnet build src/Sigtran.NET.sln -c Release --no-restore
          dotnet run --project src/Sigtran.NET.Tests/Sigtran.NET.Tests.csproj -c Release --no-build
          dotnet pack src/Sigtran.NET/Sigtran.NET.csproj -c Release --no-build /p:Version="$RELEASE_VERSION"
          mkdir -p artifacts/signing
          cp "src/Sigtran.NET/bin/Release/Sigtran.NET.$RELEASE_VERSION.nupkg" artifacts/signing/

      - name: Discover organization signing certificate identity
        shell: bash
        env:
          SIGNING_CERTIFICATE: ${{ secrets.SIGNING_CERTIFICATE }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SIGNING_CERTIFICATE"
          test -n "$SIGNING_CERTIFICATE_PASSWORD"

          pfx="$RUNNER_TEMP/stable-signing.pfx"
          cert="$RUNNER_TEMP/stable-signing.crt"
          chain="$RUNNER_TEMP/stable-signing-chain.pem"

          printf '%s' "$SIGNING_CERTIFICATE" | base64 -d > "$pfx"
          chmod 600 "$pfx"
          test "$(stat -c '%a' "$pfx")" = "600"

          openssl pkcs12             -in "$pfx"             -passin env:SIGNING_CERTIFICATE_PASSWORD             -clcerts -nokeys             -out "$cert"

          openssl pkcs12             -in "$pfx"             -passin env:SIGNING_CERTIFICATE_PASSWORD             -cacerts -nokeys             -out "$chain"

          subject="$(openssl x509 -in "$cert" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')"
          issuer="$(openssl x509 -in "$cert" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
          sha256="$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          not_before="$(openssl x509 -in "$cert" -noout -startdate | cut -d= -f2-)"
          not_after="$(openssl x509 -in "$cert" -noout -enddate | cut -d= -f2-)"

          if [ "$subject" = "$issuer" ]; then
            echo "Stable signing certificate must not be self-issued." >&2
            exit 1
          fi

          openssl x509 -in "$cert" -checkend 2592000 -noout

          if [ -s "$chain" ]; then
            openssl verify -CApath /etc/ssl/certs -untrusted "$chain" "$cert"               | tee artifacts/signing/certificate-chain-verification.txt
          else
            openssl verify -CApath /etc/ssl/certs "$cert"               | tee artifacts/signing/certificate-chain-verification.txt
          fi

          {
            echo "subject=$subject"
            echo "issuer=$issuer"
            echo "sha256=$sha256"
            echo "notBefore=$not_before"
            echo "notAfter=$not_after"
          } | tee artifacts/signing/certificate-identity.txt

          echo "SIGNING_PFX=$pfx" >> "$GITHUB_ENV"
          echo "DISCOVERED_SIGNING_CERTIFICATE_SHA256=$sha256" >> "$GITHUB_ENV"

      - name: Validate protected certificate fingerprint
        shell: bash
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
          TRUSTED_SHA256: ${{ vars.TRUSTED_SIGNING_CERTIFICATE_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$TRUSTED_SHA256" ]; then
            echo "TRUSTED_SIGNING_CERTIFICATE_SHA256 is not configured." >&2
            echo "Set it to: $DISCOVERED_SIGNING_CERTIFICATE_SHA256" >&2
            exit 3
          fi

          SIGNING_CERTIFICATE_PASSWORD="$SIGNING_CERTIFICATE_PASSWORD"             bash eng/verify-signing-certificate.sh               "$SIGNING_PFX"               "$TRUSTED_SHA256"             | tee artifacts/signing/certificate-verification.txt

      - name: Sign and timestamp stable candidate
        shell: bash
        env:
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          package="artifacts/signing/Sigtran.NET.$RELEASE_VERSION.nupkg"
          dotnet nuget sign "$package"             --certificate-path "$SIGNING_PFX"             --certificate-password "$SIGNING_CERTIFICATE_PASSWORD"             --timestamper "$TIMESTAMP_AUTHORITY"             --overwrite
          dotnet nuget verify "$package" --all --verbosity detailed             | tee artifacts/signing/package-verification.txt
          sha256sum artifacts/signing/* > artifacts/signing/sha256.txt

      - name: Cleanup private signing material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- \
            "$RUNNER_TEMP/stable-signing.pfx" \
            "$RUNNER_TEMP/stable-signing.crt" \
            "$RUNNER_TEMP/stable-signing-chain.pem"

      - name: Write preflight summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# Phase 56 Trusted Stable Signing Preflight"
            echo
            printf -- '- Workflow run: `%s`\n' "$GITHUB_RUN_ID"
            printf -- '- Stable candidate: `Sigtran.NET %s`\n' "$RELEASE_VERSION"
            echo "- Organization certificate validation: PASS"
            echo "- Protected fingerprint match: PASS"
            echo "- Public chain / expiry policy: PASS"
            echo "- Timestamped NuGet author signing: PASS"
            echo "- NuGet signature verification: PASS"
            echo "- Publication performed: NO"
          } > artifacts/signing/summary.md

      - name: Upload signing preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase56-trusted-signing-preflight
          path: artifacts/signing
          retention-days: 90
