name: phase56-multi-host-soak

on:
  workflow_dispatch:
    inputs:
      qualification_profile:
        description: Qualification duration profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - stress
          - soak
          - release
      fault_scenario:
        description: Authorized lab fault injected at the failover boundary
        required: true
        default: peer-restart
        type: choice
        options:
          - peer-restart
          - peer-outage
          - sctp-partition
      fault_duration_seconds:
        description: Fault hold duration for outage/partition (1-60 seconds)
        required: true
        default: "10"
        type: string
      confirmation:
        description: Type exactly "run multi host qualification"
        required: true
        type: string

concurrency:
  group: phase56-multi-host-soak
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: [self-hosted, linux, sigtran-performance-lab]
    environment:
      name: sigtran-performance
    # Self-hosted Actions jobs may run longer than GitHub-hosted jobs. This
    # budget accommodates the 24h release soak plus setup/recovery/cleanup.
    timeout-minutes: 1560
    permissions:
      contents: read
    env:
      RUN_ID: phase56-multihost-${{ github.run_id }}
      SOURCE_SHA: ${{ github.sha }}
      QUALIFICATION_PROFILE: ${{ inputs.qualification_profile }}
      FAULT_SCENARIO: ${{ inputs.fault_scenario }}
      FAULT_DURATION_SECONDS: ${{ inputs.fault_duration_seconds }}
      REMOTE_IP: ${{ secrets.PERF_REMOTE_IP }}
      REMOTE_SCTP_PORT: ${{ secrets.PERF_REMOTE_PORT }}
      OPC: ${{ vars.PERF_LOCAL_POINT_CODE || '1' }}
      DPC: ${{ vars.PERF_REMOTE_POINT_CODE || '2' }}
      NETWORK_INDICATOR: ${{ vars.PERF_NETWORK_INDICATOR || '2' }}
      PEER_NAME: ${{ vars.PERF_PEER_NAME || 'remote-reference-peer' }}
      SDK_HOST_ID: ${{ vars.PERF_SDK_HOST_ID }}
      PEER_HOST_ID: ${{ vars.PERF_PEER_HOST_ID }}
      CAPTURE_INTERFACE: ${{ vars.PERF_CAPTURE_INTERFACE || 'any' }}
      RAW_EVIDENCE_ROOT: ${{ vars.PERF_RAW_EVIDENCE_ROOT }}
      PEER_SSH_HOST: ${{ secrets.PERF_PEER_SSH_HOST }}
      PEER_SSH_USER: ${{ secrets.PERF_PEER_SSH_USER }}
      PEER_SSH_PRIVATE_KEY: ${{ secrets.PERF_PEER_SSH_PRIVATE_KEY }}
      PEER_SSH_KNOWN_HOSTS: ${{ secrets.PERF_PEER_SSH_KNOWN_HOSTS }}
      PEER_SERVICE: ${{ vars.PERF_PEER_SERVICE }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Validate protected lab configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "run multi host qualification"
          for value in             "$REMOTE_IP"             "$REMOTE_SCTP_PORT"             "$SDK_HOST_ID"             "$PEER_HOST_ID"             "$RAW_EVIDENCE_ROOT"             "$PEER_SSH_HOST"             "$PEER_SSH_USER"             "$PEER_SSH_PRIVATE_KEY"             "$PEER_SSH_KNOWN_HOSTS"             "$PEER_SERVICE"; do
            test -n "$value"
          done
          test "$SDK_HOST_ID" != "$PEER_HOST_ID"
          for cmd in dotnet tcpdump tshark sha256sum python3 ssh timeout; do
            command -v "$cmd" >/dev/null
          done
          sudo -n true >/dev/null
          bash -n scripts/run-multi-host-qualification.sh
          PLAN_ONLY=true bash scripts/run-multi-host-qualification.sh

      - name: Configure peer SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PEER_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PEER_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes "$PEER_SSH_USER@$PEER_SSH_HOST"             'hostname; uname -r'

      - name: Build performance lab
        run: >-
          dotnet build
          src/Sigtran.NET.PerformanceLab/Sigtran.NET.PerformanceLab.csproj
          -c Release -m:1

      - name: Run representative multi-host qualification
        shell: bash
        run: bash scripts/run-multi-host-qualification.sh

  retain-evidence:
    needs: qualify
    runs-on: [self-hosted, linux, sigtran-performance-lab]
    environment:
      name: sigtran-performance
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    env:
      RUN_ID: phase56-multihost-${{ github.run_id }}
      RAW_EVIDENCE_ROOT: ${{ vars.PERF_RAW_EVIDENCE_ROOT }}
      QUALIFICATION_PROFILE: ${{ inputs.qualification_profile }}
      FAULT_SCENARIO: ${{ inputs.fault_scenario }}

    steps:
      - name: Checkout canonical main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Validate retained sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          command -v gh >/dev/null
          safe="$RAW_EVIDENCE_ROOT/$RUN_ID/safe"
          test -f "$safe/summary.json"
          test -f "$safe/report.md"
          test -f "$safe/raw-evidence.sha256"
          test -f "$safe/sha256.txt"
          python3 - "$safe/summary.json" <<'PY'
          import json, sys
          value=json.load(open(sys.argv[1]))
          if value.get("passed") is not True:
              raise SystemExit("sanitized qualification summary is not passing")
          PY
          (
            cd "$safe"
            sha256sum -c sha256.txt
          )

      - name: Retain sanitized evidence branch
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="docs/evidence/PHASE56_MULTIHOST_$GITHUB_RUN_ID"
          evidence_branch="evidence/multihost-$GITHUB_RUN_ID"
          safe="$RAW_EVIDENCE_ROOT/$RUN_ID/safe"

          git checkout -B "$evidence_branch" origin/main
          mkdir -p "$evidence_dir"
          cp -a "$safe/." "$evidence_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$evidence_dir"
          git commit -m "evidence: retain representative multi-host qualification $GITHUB_RUN_ID"
          git push origin "$evidence_branch"

          echo "branch=$evidence_branch" >> "$GITHUB_OUTPUT"
          echo "evidence_dir=$evidence_dir" >> "$GITHUB_OUTPUT"

      - name: Open evidence review pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.evidence.outputs.branch }}
          EVIDENCE_DIR: ${{ steps.evidence.outputs.evidence_dir }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/multihost-pr.md"
          cat >"$body" <<EOF
          Phase 56 representative multi-host qualification evidence.

          Profile: $QUALIFICATION_PROFILE
          Fault scenario: $FAULT_SCENARIO

          SDK and peer hosts are required to be distinct. Raw packet/log
          evidence remains on protected lab storage; this PR contains only
          sanitized summaries and digest references.

          Retained evidence: $EVIDENCE_DIR
          Workflow run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This evidence PR does **not** automatically promote the
          `multi-host-soak` stable gate. Gate promotion requires review of the
          measured topology, duration, fault scenario, digests, and completion
          of the required qualification matrix.
          EOF

          gh pr create             --repo "$GITHUB_REPOSITORY"             --base main             --head "$BRANCH"             --title "evidence: retain multi-host $QUALIFICATION_PROFILE/$FAULT_SCENARIO run $GITHUB_RUN_ID"             --body-file "$body"
