apiVersion: apps/v1
kind: Deployment
metadata:
  name: sigtran-node
  labels:
    app.kubernetes.io/name: sigtran-node
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sigtran-node
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sigtran-node
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: sigtran-node
          image: ghcr.io/araditc/sigtran-net-operations-host:VERSION
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sigtran-node
          ports:
            - name: management
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /health/live
              port: management
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: sigtran-node-management
spec:
  selector:
    app.kubernetes.io/name: sigtran-node
  ports:
    - name: management
      port: 8080
      targetPort: management
